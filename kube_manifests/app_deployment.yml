apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: todo-frontend:2.0
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: nconfig
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
#          startupProbe:
#            httpGet:
#              path: /
#              port: http
#            periodSeconds: 5
#            timeoutSeconds: 2
#            failureThreshold: 12
#          readinessProbe:
#            httpGet:
#              path: /
#              port: http
#            periodSeconds: 10
#            timeoutSeconds: 2
#            failureThreshold: 3
#          livenessProbe:
#            httpGet:
#              path: /
#              port: http
#            periodSeconds: 20
#            timeoutSeconds: 2
#            failureThreshold: 3
      volumes:
        - name: nconfig
          configMap:
            name: nginx-config
