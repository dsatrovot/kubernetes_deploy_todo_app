apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frontend-tls
spec:
  secretName: frontend-tls
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - frontend
    - frontend.default
    - frontend.default.svc
    - frontend.default.svc.cluster.local
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
