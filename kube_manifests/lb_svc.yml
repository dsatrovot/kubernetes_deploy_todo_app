apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway-lb
  labels:
    expose-bgp: "true"
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
  selector:
    gateway.networking.k8s.io/gateway-name: public-gateway
