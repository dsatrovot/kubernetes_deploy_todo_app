apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    database: postgres
spec:
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels:
      database: postgres
  template:
    metadata:
      labels:
        database: postgres
    spec:
      containers:
        - name: postgres
          image: postgres
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-claim
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-claim
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10G
        

